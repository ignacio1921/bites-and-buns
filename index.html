<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bites & Buns</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 15px;
}

.logo {
  width: 120px;
  margin-bottom: 10px;
}

h1 {
  font-size: 26px;
  margin: 10px 0;
}

p {
  font-size: 14px;
}

/* BOTONES */
.delivery {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.btn {
  padding: 15px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  text-align: center;
  font-size: 16px;
}

.glovo { background: #FFC244; color: black; }
.justeat { background: #ff8000; color: white; }
.uber { background: #111; color: white; border: 1px solid white; }

/* MENÚ */
.menu {
  padding: 20px 10px;
}

.menu h2 {
  text-align: center;
}

.card {
  background: #111;
  border: 2px solid orange;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 15px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  margin: 8px 0;
}

.price {
  color: #FFC244;
  font-weight: bold;
}

.alergenos {
  font-size: 12px;
  color: #ccc;
}

/* CHAT */
.chat {
  position: fixed;
  bottom: 10px;
  right: 10px;
  left: 10px;
  background: #111;
  padding: 10px;
  border-radius: 10px;
}

.chat input {
  width: 100%;
  padding: 8px;
  margin-bottom: 5px;
}

.chat button {
  width: 100%;
  padding: 10px;
}

/* TABLET Y PC */
@media(min-width: 768px) {

  .delivery {
    flex-direction: row;
    justify-content: center;
  }

  .menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    width: 250px;
    margin: 10px;
  }

  .chat {
    width: 300px;
    left: auto;
  }
}
</style>

</head>
<body>

<!-- HERO -->
<section class="hero">
  <img src="logo.png" class="logo">
  <h1>🌭 Bites & Buns</h1>
  <p>Calidad en cada bocado 🔥</p>

  <div class="delivery">
    <a href="#" class="btn glovo">Pedir en Glovo</a>
    <a href="#" class="btn justeat">Just Eat</a>
    <a href="#" class="btn uber">Uber Eats</a>
  </div>
</section>

<!-- MENÚ -->
<section class="menu">

<h2>🌭 Hot Dogs</h2>

<div class="card">
  <img src="https://source.unsplash.com/400x300/?hotdog">
  <h3>American</h3>
  <p>Clásico con salsas</p>
  <p class="price">4.55€</p>
  <p class="alergenos">🌾 Gluten</p>
</div>

<div class="card">
  <img src="https://source.unsplash.com/400x300/?spicy,hotdog">
  <h3>Mexican</h3>
  <p>Toque picante 🌶️</p>
  <p class="price">4.55€</p>
  <p class="alergenos">🌾 Gluten 🌶️ Picante</p>
</div>

<div class="card">
  <img src="https://source.unsplash.com/400x300/?bbq,hotdog">
  <h3>Chicken BBQ</h3>
  <p>Salsa barbacoa</p>
  <p class="price">4.55€</p>
  <p class="alergenos">🌾 Gluten</p>
</div>

<div class="card">
  <img src="https://source.unsplash.com/400x300/?cheese,hotdog">
  <h3>ChiliCheddar</h3>
  <p>Con queso cheddar</p>
  <p class="price">4.55€</p>
  <p class="alergenos">🌾 Gluten 🥛 Lácteos</p>
</div>

</section>

<!-- CHAT IA SIMPLE -->
<div class="chat">
  <input id="input" placeholder="¿Qué te apetece?">
  <button onclick="responder()">Preguntar</button>
  <p id="respuesta"></p>
</div>

<script>
function responder() {
  let input = document.getElementById("input").value.toLowerCase();
  let respuesta = "";

  if (input.includes("picante")) {
    respuesta = "🔥 Te recomiendo el Mexican";
  } else if (input.includes("queso")) {
    respuesta = "🧀 Prueba el ChiliCheddar";
  } else {
    respuesta = "🌭 Tenemos los mejores hot dogs!";
  }

  document.getElementById("respuesta").innerText = respuesta;
}
</script>

</body>
</html>
